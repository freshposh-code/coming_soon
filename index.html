<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Junuvo Internet Banking | Coming Soon</title>
  <meta name="description" content="Junuvo Internet Banking is launching soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./dist/output.css" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#031a45" />
</head>
<body class="min-h-screen overflow-hidden bg-navy text-white antialiased">

  <!-- Page behind the overlay -->
<!-- <main class="fixed inset-0 bg-navy">
  <img src="./assets/hero.png" alt="Junuvo Internet Banking" class="h-full w-full object-cover object-[70%_center] sm:object-top" />
</main> -->

<!-- Page behind the overlay -->
<main class="fixed inset-0 overflow-hidden bg-navy">
  <img src="./assets/hero.png" alt="Junuvo Internet Banking" class="h-full w-full object-cover object-[70%_center] sm:object-top" />
  <div class="absolute inset-0 bg-navy/50"></div>
  <div class="absolute left-1/2 top-1/2 h-[28rem] w-[28rem] -translate-x-1/2 -translate-y-1/2 rounded-full bg-brand/30 blur-[120px]"></div>

  <!-- App screenshots -->
  <div aria-hidden="true" class="absolute inset-0 flex items-center justify-center gap-2 px-2 sm:gap-4 lg:gap-7">

    <div class="hidden translate-y-12 rotate-[-9deg] sm:block">
      <div class="animate-phone relative aspect-[485/1080] w-24 overflow-hidden rounded-[1.5rem] border-[5px] border-[#0a1224] bg-[#0a1224] shadow-[0_30px_60px_-10px_rgba(0,0,0,0.75),0_0_40px_rgba(11,92,255,0.35)] ring-1 ring-white/30 [animation-delay:-3s] sm:w-28 lg:w-40 lg:rounded-[2rem]">
        <img src="./assets/app1.png" alt="" loading="lazy" class="h-full w-full object-cover object-top" />
        <span class="absolute left-1/2 top-1.5 h-1.5 w-8 -translate-x-1/2 rounded-full bg-black/80"></span>
        <span class="pointer-events-none absolute inset-0 bg-gradient-to-br from-white/25 via-transparent to-transparent"></span>
      </div>
    </div>

    <div class="-translate-y-6 rotate-[-4deg]">
      <div class="animate-phone relative aspect-[485/1080] w-28 overflow-hidden rounded-[1.5rem] border-[5px] border-[#0a1224] bg-[#0a1224] shadow-[0_30px_60px_-10px_rgba(0,0,0,0.75),0_0_40px_rgba(11,92,255,0.35)] ring-1 ring-white/30 [animation-delay:-2s] sm:w-32 lg:w-44 lg:rounded-[2rem]">
        <img src="./assets/app2.png" alt="" loading="lazy" class="h-full w-full object-cover object-top" />
        <span class="absolute left-1/2 top-1.5 h-1.5 w-8 -translate-x-1/2 rounded-full bg-black/80"></span>
        <span class="pointer-events-none absolute inset-0 bg-gradient-to-br from-white/25 via-transparent to-transparent"></span>
      </div>
    </div>

    <div class="translate-y-6">
      <div class="animate-phone relative aspect-[485/1080] w-32 overflow-hidden rounded-[1.7rem] border-[5px] border-[#0a1224] bg-[#0a1224] shadow-[0_40px_80px_-10px_rgba(0,0,0,0.8),0_0_60px_rgba(11,92,255,0.5)] ring-1 ring-white/40 sm:w-36 lg:w-52 lg:rounded-[2.4rem]">
        <img src="./assets/app3.png" alt="" loading="lazy" class="h-full w-full object-cover object-top" />
        <span class="absolute left-1/2 top-1.5 h-1.5 w-9 -translate-x-1/2 rounded-full bg-black/80"></span>
        <span class="pointer-events-none absolute inset-0 bg-gradient-to-br from-white/25 via-transparent to-transparent"></span>
      </div>
    </div>

    <div class="-translate-y-6 rotate-[4deg]">
      <div class="animate-phone relative aspect-[485/1080] w-28 overflow-hidden rounded-[1.5rem] border-[5px] border-[#0a1224] bg-[#0a1224] shadow-[0_30px_60px_-10px_rgba(0,0,0,0.75),0_0_40px_rgba(11,92,255,0.35)] ring-1 ring-white/30 [animation-delay:-1s] sm:w-32 lg:w-44 lg:rounded-[2rem]">
        <img src="./assets/app4.png" alt="" loading="lazy" class="h-full w-full object-cover object-top" />
        <span class="absolute left-1/2 top-1.5 h-1.5 w-8 -translate-x-1/2 rounded-full bg-black/80"></span>
        <span class="pointer-events-none absolute inset-0 bg-gradient-to-br from-white/25 via-transparent to-transparent"></span>
      </div>
    </div>

    <div class="hidden translate-y-12 rotate-[9deg] sm:block">
      <div class="animate-phone relative aspect-[485/1080] w-24 overflow-hidden rounded-[1.5rem] border-[5px] border-[#0a1224] bg-[#0a1224] shadow-[0_30px_60px_-10px_rgba(0,0,0,0.75),0_0_40px_rgba(11,92,255,0.35)] ring-1 ring-white/30 [animation-delay:-4s] sm:w-28 lg:w-40 lg:rounded-[2rem]">
        <img src="./assets/app5.png" alt="" loading="lazy" class="h-full w-full object-cover object-top" />
        <span class="absolute left-1/2 top-1.5 h-1.5 w-8 -translate-x-1/2 rounded-full bg-black/80"></span>
        <span class="pointer-events-none absolute inset-0 bg-gradient-to-br from-white/25 via-transparent to-transparent"></span>
      </div>
    </div>

  </div>
</main>

  <!-- Coming soon overlay -->
  <section
    id="overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cs-title"
     class="fixed inset-0 z-50 overflow-y-auto bg-navy/10 backdrop-blur-[1px] transition-opacity duration-700"
  >
    <!-- Glow and readability layers -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 overflow-hidden">
      <div class="animate-float absolute -left-24 top-10 h-96 w-96 rounded-full bg-brand/15 blur-3xl"></div>
      <div class="animate-float-slow absolute -right-24 bottom-0 h-96 w-96 rounded-full bg-accent/10 blur-3xl"></div>
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(3,26,69,0.3)_0%,rgba(3,26,69,0.12)_50%,rgba(3,26,69,0)_100%)]"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-navy/20 via-transparent to-navy/30"></div>
    </div>

    <!-- Scroll-safe centering wrapper -->
    <div class="relative flex min-h-full items-center justify-center px-4 py-6 sm:py-8">
      <div class="relative mx-auto w-full max-w-3xl text-center">

        <!-- Logo -->
        <div class="animate-fade-up relative mx-auto mb-6 inline-block">
        <div aria-hidden="true" class="absolute -inset-4 rounded-3xl bg-brand/50 blur-2xl"></div>
        <div class="relative rounded-2xl border border-white/30 bg-gradient-to-br from-white/25 via-white/10 to-white/5 p-3 shadow-[0_0_40px_rgba(11,92,255,0.6)] backdrop-blur-md">
            <img src="./assets/logo.png" alt="Junuvo Solutions" class="h-14 w-auto drop-shadow-[0_4px_12px_rgba(0,0,0,0.5)] sm:h-16" />
        </div>
        </div>

        <!-- Badge -->
        <div class="animate-fade-up mb-4 block [animation-delay:100ms]">
          <span class="inline-block rounded-full border border-white/25 bg-navy/40 px-4 py-1.5 text-[11px] font-bold uppercase tracking-[0.25em] text-blue-100 backdrop-blur-md">
            Junuvo Internet Banking
          </span>
        </div>

        <!-- Heading -->
        <h1 id="cs-title" class="animate-fade-up text-5xl font-black leading-tight tracking-tight drop-shadow-[0_4px_20px_rgba(3,26,69,0.8)] [animation-delay:200ms] sm:text-6xl">
          Coming
          <span class="relative inline-block bg-gradient-to-r from-sky-400 via-sky-200 to-sky-400 bg-[length:200%_100%] bg-clip-text text-transparent animate-shimmer">
            Soon
            <span class="absolute -bottom-1 left-0 h-1.5 w-full -rotate-1 rounded-full bg-accent"></span>
          </span>
        </h1>

        <p class="animate-fade-up mx-auto mt-4 max-w-xl text-base font-black leading-relaxed text-white drop-shadow-[0_2px_10px_rgba(3,26,69,0.9)] [animation-delay:300ms] sm:text-lg">
          Internet Banking |  Mobile App | Core Banking Application | Agency Banking | Thrift Collector | Field Officer App
        </p>

        <!-- Countdown -->
        <div id="countdown" class="animate-fade-up mt-6 grid grid-cols-4 gap-3 [animation-delay:400ms] sm:gap-4" role="timer" aria-live="off">
          <div class="rounded-2xl border border-white/25 bg-navy/45 px-2 py-4 shadow-2xl shadow-black/30 backdrop-blur-md sm:py-5">
            <span id="days" class="block text-4xl font-black tabular-nums sm:text-5xl">00</span>
            <span class="mt-1.5 block text-[10px] font-semibold uppercase tracking-[0.2em] text-blue-100 sm:text-xs">Days</span>
          </div>
          <div class="rounded-2xl border border-white/25 bg-navy/45 px-2 py-4 shadow-2xl shadow-black/30 backdrop-blur-md sm:py-5">
            <span id="hours" class="block text-4xl font-black tabular-nums sm:text-5xl">00</span>
            <span class="mt-1.5 block text-[10px] font-semibold uppercase tracking-[0.2em] text-blue-100 sm:text-xs">Hours</span>
          </div>
          <div class="rounded-2xl border border-white/25 bg-navy/45 px-2 py-4 shadow-2xl shadow-black/30 backdrop-blur-md sm:py-5">
            <span id="minutes" class="block text-4xl font-black tabular-nums sm:text-5xl">00</span>
            <span class="mt-1.5 block text-[10px] font-semibold uppercase tracking-[0.2em] text-blue-100 sm:text-xs">Minutes</span>
          </div>
          <div class="rounded-2xl border border-accent/60 bg-navy/45 px-2 py-4 shadow-2xl shadow-black/30 backdrop-blur-md sm:py-5">
            <span id="seconds" class="block text-4xl font-black tabular-nums text-accent sm:text-5xl">00</span>
            <span class="mt-1.5 block text-[10px] font-semibold uppercase tracking-[0.2em] text-orange-200 sm:text-xs">Seconds</span>
          </div>
        </div>
        <p id="sr-time" class="sr-only" aria-live="polite"></p>

      
        <p id="form-msg" class="mt-2 min-h-5 text-sm drop-shadow-[0_2px_8px_rgba(3,26,69,0.9)]" aria-live="polite"></p>

        <!-- Features -->
        <ul class="animate-fade-up mt-4 flex flex-wrap items-center justify-center gap-x-8 gap-y-2 text-xs font-medium text-white drop-shadow-[0_2px_8px_rgba(3,26,69,0.9)] [animation-delay:700ms]">
          <li class="flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-sky-300"></span>Secure &amp; Compliant</li>
          <li class="flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-emerald-400"></span>Always Available</li>
          <li class="flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-accent"></span>Live Visibility</li>
        </ul>

        <p class="mt-5 text-xs text-slate-200 drop-shadow-[0_2px_8px_rgba(3,26,69,0.9)]">&copy; <span id="year"></span> Junuvo Solutions. All rights reserved.</p>
      </div>
    </div>
  </section>

  <script src="./script.js" defer></script>
</body>
</html>
